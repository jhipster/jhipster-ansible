---

# Update with upstream
# A maintenance branch may not exist locally yet: create it from upstream's.
- name: Fetch upstream and rebase {{branch}}
  shell: git fetch upstream && (git checkout {{branch}} || git checkout -b {{branch}} --track upstream/{{branch}}) && git rebase upstream/{{branch}}
  args:
    chdir: '{{github_folder}}/{{github_repository}}'
  ignore_errors: no

# Release
- name: Install node_modules
  shell: npm ci
  args:
    chdir: '{{github_folder}}/{{github_repository}}'

# Release
- name: Release {{release_type}}
  shell: npm version {{release_type}} -a -m 'Release v%s'
  args:
    chdir: '{{github_folder}}/{{github_repository}}'
