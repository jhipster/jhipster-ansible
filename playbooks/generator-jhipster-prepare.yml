---
- hosts: localhost
  roles:
    - { role: generator-jhipster-prepare, github_repository: 'generator-jhipster' }
  vars_prompt:
    - name: github_folder
      prompt: 'In which folder is the project ?'
      default: '~/projects/jhipster/'
      private: no
    - name: branch
      prompt: 'Which branch do you release from ? (main, or a maintenance branch like v9.x_maintenance)'
      default: 'main'
      private: no
    - name: release_type
      prompt: 'What type of release do you want ? (patch / minor / major)'
      private: no
